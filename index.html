<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Khmer Type – Latin to Khmer keyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f3f7; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#2f5bea;
          --line:#dfe3ee; --key:#fff; --keyalt:#d5d9e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#e8ebf4; --muted:#9aa3b8; --accent:#6e8cff;
            --line:#2c3347; --key:#2a3147; --keyalt:#161a26; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:'Noto Sans Khmer', system-ui, sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:16px 12px 24px; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  #output { width:100%; min-height:130px; resize:vertical; font:inherit; font-size:1.3rem;
            padding:12px; border:1px solid var(--line); border-radius:12px;
            background:var(--card); color:var(--text); }
  .row-actions { display:flex; gap:8px; margin:8px 0 12px; }
  .row-actions button { font:inherit; font-size:.9rem; padding:6px 12px; border-radius:8px;
            border:1px solid var(--line); background:var(--card); color:var(--text); }

  /* Keyboard panel */
  .kb { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .compose { display:flex; align-items:center; gap:8px; padding:8px 10px 0; min-height:30px;
             font-size:1rem; color:var(--accent); }
  #buf { text-decoration:underline; letter-spacing:.5px; flex:1; }
  .candwrap { display:flex; align-items:stretch; border-bottom:1px solid var(--line); }
  #cands { display:flex; gap:4px; overflow-x:auto; flex:1; padding:6px 8px; min-height:50px;
           scrollbar-width:none; }
  #cands::-webkit-scrollbar { display:none; }
  .cand { flex:0 0 auto; display:flex; align-items:baseline; gap:5px; padding:6px 12px;
          font:inherit; font-size:1.25rem; border:none; border-radius:8px;
          background:transparent; color:var(--text); }
  .cand small { color:var(--muted); font-size:.7rem; }
  .cand.first { background:var(--accent); color:#fff; }
  .cand.first small { color:#fff; }
  #more { width:44px; border:none; border-left:1px solid var(--line); background:transparent;
          color:var(--muted); font-size:1.1rem; }
  #grid { display:none; flex-wrap:wrap; gap:6px; padding:10px; border-bottom:1px solid var(--line); }
  #grid.open { display:flex; }

  .keys { padding:8px 6px 10px; display:flex; flex-direction:column; gap:7px; touch-action:manipulation; }
  .krow { display:flex; gap:5px; justify-content:center; }
  .key { flex:1; max-width:56px; height:46px; border:none; border-radius:8px; font:inherit;
         font-size:1.05rem; background:var(--key); color:var(--text);
         box-shadow:0 1px 0 var(--line); text-transform:uppercase; }
  .key:active { background:var(--accent); color:#fff; }
  .key.alt { background:var(--keyalt); max-width:none; flex:1.4; text-transform:none; font-size:.95rem; }
  .key.space { flex:5; max-width:none; text-transform:none; }
  .key.enter { flex:1.6; max-width:none; background:var(--accent); color:#fff; text-transform:none; }
  .hint { margin-top:12px; color:var(--muted); font-size:.82rem; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Khmer Type</h1>
  <textarea id="output" readonly inputmode="none" placeholder="Your Khmer text appears here…"></textarea>
  <div class="row-actions">
    <button id="copy">Copy</button>
    <button id="clear">Clear</button>
  </div>

  <div class="kb">
    <div class="compose"><span id="buf"></span></div>
    <div class="candwrap">
      <div id="cands"></div>
      <button id="more" title="Show all">▾</button>
    </div>
    <div id="grid"></div>
    <div class="keys" id="keys"></div>
  </div>

  <div class="hint">
    Type Latin letters (e.g. <b>orkun</b>, <b>knhom</b>) → tap a Khmer word.
    Space = first word · 1–9 = pick · Backspace · Esc = cancel. Your physical keyboard works too.
  </div>
</div>

<script src="dictionary.js"></script>
<script>
  // ---------- Matching engine ----------
  function norm(s) {
    return s.toLowerCase().replace(/[^a-z]/g, '')
      .replace(/ph/g, 'p').replace(/kh/g, 'k').replace(/th/g, 't')
      .replace(/ch|j/g, 'c').replace(/sh/g, 's')
      .replace(/nh|ny|gn/g, 'n')
      .replace(/ou|oo|ow|uo|ua/g, 'u')
      .replace(/ea|ie|ia|ae/g, 'e')
      .replace(/ai|ay|ei|ey/g, 'i')
      .replace(/(.)\1+/g, '$1');
  }
  function raw(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }
  function lev(a, b) {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1,
                           d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  }
  const INDEX = DICT.map(([khmer, keys, freq = 40]) => ({
    khmer, freq, keys: keys.map(k => ({ raw: raw(k), norm: norm(k) }))
  }));

  let learned = {};
  try { learned = JSON.parse(localStorage.getItem('khmerLearned') || '{}'); } catch (e) {}
  function learn(w) {
    learned[w] = (learned[w] || 0) + 1;
    try { localStorage.setItem('khmerLearned', JSON.stringify(learned)); } catch (e) {}
  }

  function search(input, limit = 30) {
    const q = raw(input);
    if (!q) return [];
    const qn = norm(input);
    const res = [];
    for (const e of INDEX) {
      let best = 0;
      for (const k of e.keys) {
        let s = 0;
        if (k.raw === q) s = 120;
        else if (k.raw.startsWith(q)) s = 100 - (k.raw.length - q.length);
        else if (k.norm === qn) s = 90;
        else if (k.norm.startsWith(qn)) s = 75 - (k.norm.length - qn.length);
        else if (qn.length >= 3) {
          const dist = lev(qn, k.norm.slice(0, qn.length));
          if (dist <= 1) s = 45 - dist * 10 - Math.abs(k.norm.length - qn.length);
        }
        if (s > best) best = s;
      }
      if (best > 0) {
        best += Math.log(e.freq + 1) * 3 + (learned[e.khmer] || 0) * 5;
        res.push({ khmer: e.khmer, score: best });
      }
    }
    res.sort((a, b) => b.score - a.score);
    const seen = new Set();
    return res.filter(r => !seen.has(r.khmer) && seen.add(r.khmer)).slice(0, limit);
  }

  // ---------- State ----------
  const output = document.getElementById('output');
  const bufEl  = document.getElementById('buf');
  const candEl = document.getElementById('cands');
  const gridEl = document.getElementById('grid');
  let buf = '', cands = [], khmerMode = true;

  function append(t) { output.value += t; output.scrollTop = output.scrollHeight; }
  function deleteLast() {
    const v = output.value;
    try {
      const segs = Array.from(new Intl.Segmenter('km', { granularity: 'grapheme' }).segment(v));
      segs.pop();
      output.value = segs.map(s => s.segment).join('');
    } catch (e) { output.value = Array.from(v).slice(0, -1).join(''); }
  }

  function refresh() {
    cands = khmerMode && buf ? search(buf) : [];
    bufEl.textContent = buf;
    candEl.innerHTML = ''; gridEl.innerHTML = '';
    cands.forEach((c, i) => {
      const mk = () => {
        const b = document.createElement('button');
        b.className = 'cand' + (i === 0 ? ' first' : '');
        b.innerHTML = c.khmer + (i < 9 ? ` <small>${i + 1}</small>` : '');
        b.onclick = () => pick(i);
        return b;
      };
      candEl.appendChild(mk());
      gridEl.appendChild(mk());
    });
    candEl.scrollLeft = 0;
    if (!cands.length) gridEl.classList.remove('open');
  }

  function commit(text) { append(text); buf = ''; refresh(); }
  function pick(i) { if (cands[i]) { learn(cands[i].khmer); commit(cands[i].khmer); } }
  function typeLetter(ch) { if (khmerMode) { buf += ch; refresh(); } else append(ch); }
  function doSpace()  { if (cands.length) pick(0); else if (buf) commit(buf); else append(' '); }
  function doEnter()  { if (buf) commit(buf); else append('\n'); }
  function doBack()   { if (buf) { buf = buf.slice(0, -1); refresh(); } else deleteLast(); }
  function doPunct(p) { if (cands.length) pick(0); else if (buf) commit(buf); append(p); }
  function doCancel() { buf = ''; refresh(); }

  // ---------- On-screen keyboard ----------
  const keysEl = document.getElementById('keys');
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  function addKey(parent, label, cls, fn) {
    const b = document.createElement('button');
    b.className = 'key ' + (cls || '');
    b.textContent = label;
    b.onclick = fn;
    b.onmousedown = e => e.preventDefault();
    parent.appendChild(b);
    return b;
  }
  rows.forEach((r, ri) => {
    const row = document.createElement('div'); row.className = 'krow';
    if (ri === 1) row.style.padding = '0 16px';
    if (ri === 2) addKey(row, '។', 'alt', () => doPunct('។'));
    [...r].forEach(ch => addKey(row, ch, '', () => typeLetter(ch)));
    if (ri === 2) addKey(row, '⌫', 'alt', doBack);
    keysEl.appendChild(row);
  });
  const bottom = document.createElement('div'); bottom.className = 'krow';
  const modeKey = addKey(bottom, 'ខ្មែរ', 'alt', () => {
    khmerMode = !khmerMode; buf = ''; refresh();
    modeKey.textContent = khmerMode ? 'ខ្មែរ' : 'EN';
  });
  addKey(bottom, ',', 'alt', () => doPunct(','));
  addKey(bottom, 'space', 'space', doSpace);
  addKey(bottom, '?', 'alt', () => doPunct('?'));
  addKey(bottom, '⏎', 'enter', doEnter);
  keysEl.appendChild(bottom);

  document.getElementById('more').onclick = () => {
    if (cands.length) gridEl.classList.toggle('open');
  };
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(output.value);
  document.getElementById('clear').onclick = () => { output.value = ''; doCancel(); };

  // ---------- Physical keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-z]$/i.test(e.key)) { e.preventDefault(); typeLetter(e.key.toLowerCase()); }
    else if (/^[1-9]$/.test(e.key) && cands.length) { e.preventDefault(); pick(Number(e.key) - 1); }
    else if (e.key === ' ')         { e.preventDefault(); doSpace(); }
    else if (e.key === 'Enter')     { e.preventDefault(); doEnter(); }
    else if (e.key === 'Backspace') { e.preventDefault(); doBack(); }
    else if (e.key === 'Escape')    { doCancel(); }
  });

  refresh();
</script>
</body>
</html>
