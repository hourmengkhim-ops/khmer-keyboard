<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khmer Type – Latin to Khmer keyboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#2f5bea; --line:#dfe3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#e8ebf4; --muted:#9aa3b8; --accent:#6e8cff; --line:#2c3347; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:'Noto Sans Khmer', system-ui, sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  #output { width:100%; min-height:140px; resize:vertical; font:inherit; font-size:1.3rem;
            padding:12px; border:1px solid var(--line); border-radius:10px;
            background:transparent; color:var(--text); }
  #compose { width:100%; margin-top:12px; font:inherit; font-size:1.1rem; padding:12px;
             border:2px solid var(--accent); border-radius:10px;
             background:transparent; color:var(--text); }
  #bar { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; min-height:52px; }
  .cand { display:flex; align-items:center; gap:8px; padding:8px 14px; font:inherit;
          font-size:1.2rem; border:1px solid var(--line); border-radius:10px;
          background:var(--card); color:var(--text); cursor:pointer; }
  .cand:first-child { border-color:var(--accent); }
  .cand:hover { background:var(--accent); color:#fff; }
  .cand small { color:var(--muted); font-size:.75rem; }
  .cand:hover small { color:#fff; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { font:inherit; padding:8px 14px; border-radius:10px; border:1px solid var(--line);
                background:transparent; color:var(--text); cursor:pointer; }
  .help { margin-top:16px; color:var(--muted); font-size:.85rem; line-height:1.6; }
  kbd { background:var(--line); border-radius:4px; padding:1px 6px; font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Khmer Type</h1>
  <p class="sub">Type Khmer in Latin letters (e.g. <b>orkun</b>, <b>knhom</b>, <b>srok</b>) and pick the Khmer word.</p>

  <div class="card">
    <textarea id="output" placeholder="Your Khmer text appears here…" spellcheck="false"></textarea>
    <input id="compose" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Type here, e.g. sralanh">
    <div id="bar" aria-live="polite"></div>
    <div class="row">
      <button id="copy">Copy</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="help">
    <kbd>Space</kbd> or <kbd>1</kbd>–<kbd>5</kbd> pick a word &nbsp;·&nbsp;
    <kbd>Enter</kbd> insert what you typed &nbsp;·&nbsp;
    <kbd>Esc</kbd> cancel &nbsp;·&nbsp;
    <kbd>Backspace</kbd> on empty box deletes the last Khmer character
  </div>
</div>

<script src="dictionary.js"></script>
<script>
  // ---------- Normalisation: map different Latin spellings to one form ----------
  function norm(s) {
    return s.toLowerCase().replace(/[^a-z]/g, '')
      .replace(/ph/g, 'p').replace(/kh/g, 'k').replace(/th/g, 't')
      .replace(/ch|j/g, 'c').replace(/sh/g, 's')
      .replace(/nh|ny|gn/g, 'n')
      .replace(/ou|oo|ow|uo|ua/g, 'u')
      .replace(/ea|ie|ia|ae/g, 'e')
      .replace(/ai|ay|ei|ey/g, 'i')
      .replace(/(.)\1+/g, '$1');
  }
  function raw(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }

  function lev(a, b) {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1,
                           d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  }

  // ---------- Build index ----------
  const INDEX = DICT.map(([khmer, keys, freq]) => ({
    khmer, freq,
    keys: keys.map(k => ({ raw: raw(k), norm: norm(k) }))
  }));

  // ---------- Learning (remembers what you pick; stays on this device) ----------
  let learned = {};
  try { learned = JSON.parse(localStorage.getItem('khmerLearned') || '{}'); } catch (e) {}
  function learn(word) {
    learned[word] = (learned[word] || 0) + 1;
    try { localStorage.setItem('khmerLearned', JSON.stringify(learned)); } catch (e) {}
  }

  // ---------- Search ----------
  function search(input) {
    const q = raw(input);
    if (!q) return [];
    const qn = norm(input);
    const results = [];
    for (const e of INDEX) {
      let best = 0;
      for (const k of e.keys) {
        let s = 0;
        if (k.raw === q) s = 120;
        else if (k.raw.startsWith(q)) s = 100 - (k.raw.length - q.length);
        else if (k.norm === qn) s = 90;
        else if (k.norm.startsWith(qn)) s = 75 - (k.norm.length - qn.length);
        else if (qn.length >= 3) {
          const dist = lev(qn, k.norm.slice(0, qn.length));
          if (dist <= 1) s = 45 - dist * 10 - Math.abs(k.norm.length - qn.length);
        }
        if (s > best) best = s;
      }
      if (best > 0) {
        best += Math.log(e.freq + 1) * 3 + (learned[e.khmer] || 0) * 5;
        results.push({ khmer: e.khmer, score: best });
      }
    }
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, 5);
  }

  // ---------- UI ----------
  const output  = document.getElementById('output');
  const compose = document.getElementById('compose');
  const bar     = document.getElementById('bar');
  let current = [];

  function render() {
    current = search(compose.value);
    bar.innerHTML = '';
    current.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'cand';
      b.innerHTML = `${c.khmer} <small>${i + 1}</small>`;
      b.onmousedown = e => e.preventDefault();      // keep focus in the input
      b.onclick = () => pick(i);
      bar.appendChild(b);
    });
  }

  function insert(text) {
    output.value += text;
    compose.value = '';
    render();
    compose.focus();
  }

  function pick(i) {
    if (!current[i]) return;
    learn(current[i].khmer);
    insert(current[i].khmer);
  }

  compose.addEventListener('input', render);
  compose.addEventListener('keydown', e => {
    if (e.key === ' ') {
      if (current.length) { e.preventDefault(); pick(0); }
      else if (!compose.value) { /* allow plain space in output */ e.preventDefault(); insert(' '); }
    } else if (/^[1-5]$/.test(e.key) && current.length) {
      e.preventDefault(); pick(Number(e.key) - 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (compose.value) insert(compose.value); else insert('\n');
    } else if (e.key === 'Escape') {
      compose.value = ''; render();
    } else if (e.key === 'Backspace' && !compose.value) {
      e.preventDefault();
      output.value = Array.from(output.value).slice(0, -1).join('');
    }
  });

  document.getElementById('copy').onclick = () => {
    navigator.clipboard.writeText(output.value);
  };
  document.getElementById('clear').onclick = () => {
    output.value = ''; compose.value = ''; render(); compose.focus();
  };

  compose.focus();
</script>
</body>
</html>
